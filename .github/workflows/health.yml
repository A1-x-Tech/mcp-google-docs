name: Health check

# End-to-end read-only check against the live Google APIs. Auth is the OAuth2
# refresh flow (client id/secret + refresh token stored as repo secrets — no per-run
# minting by hand). smoke makes NO writes here: it fetches one document when
# GOOGLE_DOCS_SMOKE_DOCUMENT_ID is set, otherwise it only exchanges the refresh token
# for an access token (the disposable-doc write scenario is opt-in via
# GOOGLE_DOCS_SMOKE_LIVE_WRITE and is NOT enabled in CI). Runs daily + manual
# dispatch only (never on push/PR), so secrets aren't exposed to PRs/forks; the
# smoke step skips itself when the secrets are not configured.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-google-docs'
    env:
      GOOGLE_DOCS_CLIENT_ID: ${{ secrets.GOOGLE_DOCS_CLIENT_ID }}
      GOOGLE_DOCS_CLIENT_SECRET: ${{ secrets.GOOGLE_DOCS_CLIENT_SECRET }}
      GOOGLE_DOCS_REFRESH_TOKEN: ${{ secrets.GOOGLE_DOCS_REFRESH_TOKEN }}
      GOOGLE_DOCS_SMOKE_DOCUMENT_ID: ${{ secrets.GOOGLE_DOCS_SMOKE_DOCUMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.GOOGLE_DOCS_CLIENT_ID != ''
        run: npm run smoke
      - name: Skipped (no secrets configured)
        if: env.GOOGLE_DOCS_CLIENT_ID == ''
        run: echo "GOOGLE_DOCS_* secrets are not set — live smoke skipped."
